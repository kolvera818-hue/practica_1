
<ion-header>
  <ion-toolbar color="primary">
    <ion-title>
      Mi Primera App 22220991
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="contenedor-home">

    <h1>Bienvenido al sistema</h1>

    <h2 *ngIf="nombreUsuario">
      Hola, {{ nombreUsuario }}
    </h2>

    <p>
      Selecciona una opción para continuar.
    </p>

    <ion-button
      expand="block"
      (click)="irDetalles()">
      Comenzar Nuestro Curso
    </ion-button>

    <ion-button
      expand="block"
      (click)="irRegistro()">
      Ir al Registro
    </ion-button>

    <ion-button
      expand="block"
      (click)="irGestionAlumnos()">
      Gestión de Alumnos
    </ion-button>

    <ion-button
      expand="block"
      (click)="irGestionCarreras()">
      Gestión de Carreras
    </ion-button>

    <hr>

    <ion-button
      expand="block"
      color="danger"
      (click)="cerrarSesion()">
      Cerrar sesión
    </ion-button>

  </div>

</ion-content>
